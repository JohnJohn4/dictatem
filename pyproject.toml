[project]
name = "dictatem"
version = "0.4.0"
description = "Local voice dictation daemon for Windows and macOS"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

# A gui-scripts (NOT scripts) entry point so `uv tool install` generates a
# Windows launcher on the GUI subsystem — launching `dictatem` pops no console
# window (see ADR-0011). `python -m dictatem` keeps working; this is additive.
[project.gui-scripts]
dictatem = "dictatem.daemon:main"

[project.optional-dependencies]
runtime = [
    "faster-whisper>=1.1",
    "sounddevice>=0.5",
    "PySide6>=6.7",
    "nvidia-ml-py>=12",
    "pywin32>=306; sys_platform == 'win32'",
    # macOS native adapters (#56/#59/#61): Cocoa for NSPasteboard/NSWorkspace,
    # Quartz for CGEventTap/CGEvent. Darwin-gated so the macOS CI leg proves
    # the arm64 wheel set resolves (ADR-0018) before the adapters land.
    "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
]
runtime-gpu = [
    "dictatem[runtime]",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.8",
    "pyright>=1.1",
    "Pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dictatem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src", "tests"]
line-length = 99
# Agent worktrees and Claude Code config are not project sources.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TC"]

[tool.ruff.lint.per-file-ignores]
# Platform-only native modules guard with `if sys.platform != ...: raise`, so
# their OS-binding imports legitimately sit after that runtime check (E402).
"src/dictatem/hotkey/wh_keyboard_ll.py" = ["E402"]
"src/dictatem/hotkey/mac_hook.py" = ["E402"]
"src/dictatem/paste/mac_clipboard.py" = ["E402"]
"src/dictatem/paste/mac_keystroke.py" = ["E402"]
"src/dictatem/paste/mac_foreground.py" = ["E402"]
"src/dictatem/permissions/mac_tcc.py" = ["E402"]
"src/dictatem/macapp/activation.py" = ["E402"]

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"
include = ["src"]
exclude = [
    "src/dictatem/audio/sounddevice_capture.py",
    "src/dictatem/overlay/qt_widget.py",
    "src/dictatem/tray/qt_tray.py",
    "src/dictatem/hardware/nvidia_probe.py",
    "src/dictatem/autostart/win32_registrar.py",
    # macOS native adapters: the PyObjC bindings resolve only on macOS.
    "src/dictatem/hotkey/mac_hook.py",
    "src/dictatem/paste/mac_clipboard.py",
    "src/dictatem/paste/mac_keystroke.py",
    "src/dictatem/paste/mac_foreground.py",
    "src/dictatem/permissions/mac_tcc.py",
    "src/dictatem/permissions/qt_dialog.py",
    "src/dictatem/macapp/activation.py",
]
typeCheckingMode = "standard"
