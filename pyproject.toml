[project]
name = "dictatem"
version = "0.2.0"
description = "Local GPU-powered voice dictation daemon for Windows"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

# A gui-scripts (NOT scripts) entry point so `uv tool install` generates a
# Windows launcher on the GUI subsystem — launching `dictatem` pops no console
# window (see ADR-0011). `python -m dictatem` keeps working; this is additive.
[project.gui-scripts]
dictatem = "dictatem.daemon:main"

[project.optional-dependencies]
runtime = [
    "faster-whisper>=1.1",
    "sounddevice>=0.5",
    "PySide6>=6.7",
    "nvidia-ml-py>=12",
    "pywin32>=306; sys_platform == 'win32'",
]
runtime-gpu = [
    "dictatem[runtime]",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.8",
    "pyright>=1.1",
    "Pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dictatem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src", "tests"]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"
include = ["src"]
exclude = ["src/dictatem/audio/sounddevice_capture.py", "src/dictatem/overlay/qt_widget.py", "src/dictatem/tray/qt_tray.py", "src/dictatem/hardware/nvidia_probe.py", "src/dictatem/autostart/win32_registrar.py"]
typeCheckingMode = "standard"
