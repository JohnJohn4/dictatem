[project]
name = "dictatem"
version = "0.7.0"
description = "Local voice dictation daemon for Windows and macOS"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

# A gui-scripts (NOT scripts) entry point so `uv tool install` generates a
# Windows launcher on the GUI subsystem — launching `dictatem` pops no console
# window (see ADR-0011). `python -m dictatem` keeps working; this is additive.
[project.gui-scripts]
dictatem = "dictatem.daemon:main"

[project.optional-dependencies]
runtime = [
    "faster-whisper>=1.1",
    # faster-whisper only requires av>=11, so uv would pick the newest av — but
    # av 15+ raised its Apple-Silicon wheel floor to macOS 14, so on macOS 12/13
    # there is NO matching wheel and uv falls back to COMPILING av from source
    # (needs Xcode CLT + pkg-config + ffmpeg), which breaks the wheel-only install
    # on a clean Mac (ADR-0011) — it froze a macOS 13.5 install with a 15 GB Xcode
    # prompt. Pin macOS to av 14.2.0, the newest release with a `macosx_12` arm64
    # wheel (installs on macOS 12+). av is only faster-whisper's file-decode dep
    # and is unused on dictatem's numpy-array transcribe path, so this is
    # install-only (validated: faster-whisper 1.2.1 + av 14.2.0 transcribes fine).
    # Windows/Linux keep the latest av. Revisit if av republishes low-floor wheels.
    "av==14.2.0; sys_platform == 'darwin'",
    "sounddevice>=0.5",
    # Essentials, not the `PySide6` meta package: the meta also pulls
    # PySide6-Addons (WebEngine, PDF, 3D, Multimedia, ... ~450 MB) and dictatem
    # uses only QtCore/QtGui/QtWidgets. Same `PySide6` import name and version
    # line. If a future feature needs an Addons module, add PySide6-Addons
    # explicitly rather than reverting to the meta package.
    "PySide6-Essentials>=6.7",
    "nvidia-ml-py>=12",
    "pywin32>=306; sys_platform == 'win32'",
    # macOS native adapters (#56/#59/#61): Cocoa for NSPasteboard/NSWorkspace,
    # Quartz for CGEventTap/CGEvent, AVFoundation for AVAudioEngine mic capture
    # (ADR-0027 / #161). Darwin-gated so the macOS CI leg proves the arm64 wheel
    # set resolves (ADR-0018) before the adapters land.
    "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation>=10.3; sys_platform == 'darwin'",
]
# The Apple-GPU (MLX) transcription engine, ADR-0013 amendment / #224. The
# runtime extra stays in full: faster-whisper is the fallback engine. mlx,
# mlx-metal and torch (mlx-whisper's hard dep) publish macOS arm64 wheels for
# macOS 14+ ONLY, so pulling them on macOS 12/13 or Intel fails the whole
# `uv tool install` (the av-pin failure class above). The marker gates arm64
# darwin (mlx also ships win/linux wheels now, so `darwin` alone is not enough),
# making this extra identical to `runtime` everywhere else. A marker cannot say
# "macOS 14+", so install.sh asks for this extra only on arm64 + macOS >= 14
# (tests/test_apple_gpu_extra.py enforces both layers). mlx-whisper is pinned
# exactly; mlx is bounded to the range CI locks (0.30 is the first macOS-14-floor
# release, 0.32.x the tested one). Adds ~230 MB of install weight.
apple-gpu = [
    "dictatem[runtime]",
    "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx>=0.30,<0.33; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
runtime-gpu = [
    "dictatem[runtime]",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.8",
    "pyright>=1.1",
    "Pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dictatem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "real_engine: runs a real transcription engine; opt-in via DICTATEM_REAL_ENGINES=1 (see tests/test_transcriber_contract.py)",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 99
# Agent worktrees and Claude Code config are not project sources.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TC"]

[tool.ruff.lint.per-file-ignores]
# Platform-only native modules guard with `if sys.platform != ...: raise`, so
# their OS-binding imports legitimately sit after that runtime check (E402).
"src/dictatem/hotkey/wh_keyboard_ll.py" = ["E402"]
"src/dictatem/hotkey/wh_mouse_ll.py" = ["E402"]
"src/dictatem/audio/mac_audio_capture.py" = ["E402"]
"src/dictatem/hotkey/mac_hook.py" = ["E402"]
"src/dictatem/paste/mac_clipboard.py" = ["E402"]
"src/dictatem/paste/mac_keystroke.py" = ["E402"]
"src/dictatem/paste/mac_foreground.py" = ["E402"]
"src/dictatem/permissions/mac_tcc.py" = ["E402"]
"src/dictatem/macapp/activation.py" = ["E402"]

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"
include = ["src"]
exclude = [
    "src/dictatem/audio/sounddevice_capture.py",
    # AVFoundation binding resolves only on macOS (like the other mac_* adapters).
    "src/dictatem/audio/mac_audio_capture.py",
    "src/dictatem/overlay/qt_widget.py",
    "src/dictatem/tray/qt_tray.py",
    "src/dictatem/hardware/nvidia_probe.py",
    "src/dictatem/autostart/win32_registrar.py",
    "src/dictatem/process/win32_stopper.py",
    "src/dictatem/upgrade/win32_upgrader.py",
    "src/dictatem/upgrade/qt_update_check.py",
    "src/dictatem/upgrade/qt_update_prompt.py",
    # macOS native adapters: the PyObjC bindings resolve only on macOS.
    "src/dictatem/hotkey/mac_hook.py",
    "src/dictatem/paste/mac_clipboard.py",
    "src/dictatem/paste/mac_keystroke.py",
    "src/dictatem/paste/mac_foreground.py",
    "src/dictatem/permissions/mac_tcc.py",
    "src/dictatem/permissions/qt_dialog.py",
    "src/dictatem/macapp/activation.py",
    # Apple-GPU engine adapter: mlx / mlx_whisper resolve only on macOS arm64.
    "src/dictatem/transcribe/mlx_backend.py",
]
typeCheckingMode = "standard"
